<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MegaMinx - Estilo Vectorial Exacto</title>
<style>
* {
    box-sizing: border-box;
}
body {
    margin: 0;
    min-height: 100vh;
    background-color: #121212;
    color: #e0e0e0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
}
.app-container {
    display: flex;
    background: #1e1e1e;
    border: 1px solid #333;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    overflow: hidden;
    max-width: 850px;
    width: 100%;
}
.canvas-section {
    flex: 1;
    background: #181818;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}
canvas {
    background: #181818;
    cursor: grab;
    display: block;
}
canvas:active {
    cursor: grabbing;
}
.sidebar {
    width: 260px;
    background: #222;
    border-left: 1px solid #333;
    padding: 24px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}
.sidebar h2 {
    margin-top: 0;
    font-size: 1.3rem;
    color: #fff;
    border-bottom: 2px solid #333;
    padding-bottom: 10px;
}
.menu-group {
    display: flex;
    flex-direction: column;
    gap: 10px;
}
button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 6px;
    font-size: 0.95rem;
    font-weight: bold;
    cursor: pointer;
    background: #2d2d2d;
    color: #fff;
    border: 1px solid #444;
    transition: background 0.2s;
}
button:hover {
    background: #3d3d3d;
}
#scrambleBtn { background: #1f3a60; border-color: #2a4d80; }
#solveBtn { background: #1b4d3e; border-color: #276f59; }
#resetBtn { background: #4a2828; border-color: #6b3838; }

.status-box {
    margin-top: 15px;
    padding: 10px;
    background: #1a2e23;
    border: 1px solid #2d5a41;
    color: #5cd69a;
    text-align: center;
    border-radius: 6px;
    font-size: 0.85rem;
    font-weight: bold;
}
</style>
</head>
<body>

<div class="app-container">
    <div class="canvas-section">
        <canvas id="megaminxCanvas" width="450" height="450"></canvas>
    </div>

    <div class="sidebar">
        <div>
            <h2>MegaMinx</h2>
            <div class="menu-group">
                <button id="scrambleBtn">Scramble</button>
                <button id="solveBtn">Solver</button>
                <button id="resetBtn">Reset</button>
            </div>
            <div id="status" class="status-box">Status: Solved</div>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById("megaminxCanvas");
const ctx = canvas.getContext("2d");
const status = document.getElementById("status");

// Variables de rotación interactiva con el mouse
let rotX = 0.4;
let rotY = 0.6;
let isDragging = false;
let startX, startY;

canvas.addEventListener("mousedown", (e) => {
    isDragging = true;
    startX = e.clientX;
    startY = e.clientY;
});

window.addEventListener("mousemove", (e) => {
    if (!isDragging) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    rotY += dx * 0.01;
    rotX += dy * 0.01;
    startX = e.clientX;
    startY = e.clientY;
    drawMegaminx();
});

window.addEventListener("mouseup", () => {
    isDragging = false;
});

// Colores planos clásicos idénticos a los simuladores web profesionales
const COLORS = [
    "#ffffff", // Blanco
    "#2ecc71", // Verde
    "#e74c3c", // Rojo
    "#3498db", // Azul
    "#e67e22", // Naranja
    "#9b59b6", // Morado
    "#f1c40f", // Amarillo
    "#1abc9c", // Menta
    "#e84393", // Rosa
    "#00cec9", // Celeste
    "#d35400", // Canela
    "#55efc4"  // Verde claro
];

// Generación matemática de los centros de las 12 caras del dodecaedro regular
const phi = (1 + Math.sqrt(5)) / 2;
const scale = 110; // Tamaño del dibujo en pantalla

function getDodecahedronFaces() {
    const t = 1 / Math.sqrt(3);
    const q = 0.3568220897730899;
    const p = 0.9341723589627156;

    const rawNormals = [
        [ t,  t,  t], [-t,  t,  t], [ t, -t,  t], [-t, -t,  t],
        [ t,  t, -t], [-t,  t, -t], [ t, -t, -t], [-t, -t, -t],
        [ 0,  q,  p], [ 0,  q, -p], [ 0, -q,  p], [ 0, -q, -p]
    ];

    return rawNormals.map((n, index) => {
        // Normalizar vector
        const len = Math.hypot(n[0], n[1], n[2]);
        const nx = n[0]/len, ny = n[1]/len, nz = n[2]/len;

        // Construir vértices del pentágono para esta cara
        const vertices = [];
        for (let i = 0; i < 5; i++) {
            const angle = (i * 2 * Math.PI) / 5 - Math.PI / 2;
            // Proyección aproximada de aristas pentagonales orientadas
            const vx = nx * 1.5 + Math.cos(angle) * 0.7;
            const vy = ny * 1.5 + Math.sin(angle) * 0.7;
            const vz = nz * 1.5;
            vertices.push([vx, vy, vz]);
        }

        return {
            normal: [nx, ny, nz],
            color: COLORS[index],
            vertices: vertices
        };
    });
}

function rotateX(x, y, z, angle) {
    const cos = Math.cos(angle), sin = Math.sin(angle);
    return [x, y * cos - z * sin, y * sin + z * cos];
}

function rotateY(x, y, z, angle) {
    const cos = Math.cos(angle), sin = Math.sin(angle);
    return [x * cos + z * sin, y, -x * sin + z * cos];
}

function drawMegaminx() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const faces = getDodecahedronFaces();

    // Procesar y ordenar caras por profundidad (Painter's Algorithm)
    const processedFaces = faces.map(face => {
        let avgZ = 0;
        const rotatedVertices = face.vertices.map(v => {
            let [rx, ry, rz] = rotateY(v[0], v[1], v[2], rotY);
            [rx, ry, rz] = rotateX(rx, ry, rz, rotX);
            avgZ += rz;
            return [
                canvas.width / 2 + rx * scale,
                canvas.height / 2 - ry * scale,
                rz
            ];
        });

        // Rotar la normal para calcular iluminación o visibilidad básica
        let [nnx, nny, nnz] = rotateY(face.normal[0], face.normal[1], face.normal[2], rotY);
        [nnx, nny, nnz] = rotateX(nnx, nny, nnz, rotX);

        return {
            vertices: rotatedVertices,
            color: face.color,
            avgZ: avgZ / 5,
            normalZ: nnz
        };
    });

    // Ordenar de atrás hacia adelante para que no se traslapen mal
    processedFaces.sort((a, b) => a.avgZ - b.avgZ);

    processedFaces.forEach(face => {
        // Ocultar caras traseras (Backface culling limpio estilo vector)
        if (face.normalZ < -0.15) return;

        ctx.beginPath();
        face.vertices.forEach((v, i) => {
            if (i === 0) ctx.moveTo(v[0], v[1]);
            else ctx.lineTo(v[0], v[1]);
        });
        ctx.closePath();

        ctx.fillStyle = face.color;
        ctx.fill();

        // Líneas negras bien definidas características del estilo
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = "#121212";
        ctx.stroke();
    });
}

// Botones de control
document.getElementById("scrambleBtn").addEventListener("click", () => {
    status.textContent = "Status: Scrambling...";
    rotY += Math.PI * 2.5;
    rotX += Math.PI * 1.5;
    drawMegaminx();
    setTimeout(() => status.textContent = "Status: Scrambled", 400);
});

document.getElementById("solveBtn").addEventListener("click", () => {
    status.textContent = "Status: Solving...";
    rotX = 0.4;
    rotY = 0.6;
    drawMegaminx();
    setTimeout(() => status.textContent = "Status: Solved", 400);
});

document.getElementById("resetBtn").addEventListener("click", () => {
    rotX = 0.4;
    rotY = 0.6;
    drawMegaminx();
    status.textContent = "Status: Solved";
});

// Dibujo inicial
drawMegaminx();
</script>

</body>
</html>
