<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>easyRubik — Iniciar sesión</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #080a10;
            --panel: rgba(20, 24, 35, 0.82);
            --panel-border: rgba(255,255,255,0.09);

            --text: #f8fafc;
            --muted: #94a3b8;

            --blue: #60a5fa;
            --blue-dark: #2563eb;

            --red: #ef4444;
            --green: #22c55e;
            --yellow: #facc15;
            --orange: #f97316;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px;

            overflow: hidden;

            font-family: "Inter", sans-serif;
            color: var(--text);

            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(59,130,246,0.18),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 85% 80%,
                    rgba(239,68,68,0.13),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 50% 50%,
                    rgba(250,204,21,0.04),
                    transparent 45%
                ),
                var(--bg);
        }

        /* =========================
           FONDO DECORATIVO
        ========================= */

        .background {
            position: fixed;
            inset: 0;

            pointer-events: none;
            overflow: hidden;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.18;
            animation: floatOrb 8s ease-in-out infinite;
        }

        .orb.one {
            width: 260px;
            height: 260px;
            background: #2563eb;
            top: -100px;
            left: -80px;
        }

        .orb.two {
            width: 230px;
            height: 230px;
            background: #ef4444;
            bottom: -100px;
            right: -70px;
            animation-delay: -3s;
        }

        .orb.three {
            width: 180px;
            height: 180px;
            background: #facc15;
            top: 45%;
            right: 8%;
            opacity: 0.08;
            animation-delay: -5s;
        }

        @keyframes floatOrb {

            0%,
            100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(20px, -25px);
            }
        }

        /* =========================
           MINI CUBOS
        ========================= */

        .mini-cube {
            position: absolute;

            display: grid;

            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);

            width: 90px;
            height: 90px;

            gap: 5px;

            opacity: 0.15;

            transform: rotate(-12deg);

            animation: cubeFloat 6s ease-in-out infinite;
        }

        .mini-cube span {
            border-radius: 5px;

            box-shadow:
                inset 0 0 0 1px rgba(255,255,255,0.12),
                0 3px 8px rgba(0,0,0,0.25);
        }

        .cube-one {
            top: 12%;
            left: 12%;
        }

        .cube-two {
            bottom: 13%;
            right: 13%;

            transform: rotate(14deg) scale(0.75);

            animation-delay: -2s;
        }

        @keyframes cubeFloat {

            0%,
            100% {
                transform: translateY(0) rotate(-12deg);
            }

            50% {
                transform: translateY(-18px) rotate(-5deg);
            }
        }

        .cube-two {
            animation-name: cubeFloatTwo;
        }

        @keyframes cubeFloatTwo {

            0%,
            100% {
                transform: translateY(0) rotate(14deg) scale(0.75);
            }

            50% {
                transform: translateY(-20px) rotate(21deg) scale(0.75);
            }
        }

        /* =========================
           CONTENEDOR
        ========================= */

        .login-container {
            position: relative;
            z-index: 5;

            width: 100%;
            max-width: 430px;

            animation: appear 0.7s cubic-bezier(.2,.8,.2,1);
        }

        @keyframes appear {

            from {
                opacity: 0;
                transform: translateY(25px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* =========================
           LOGO SUPERIOR
        ========================= */

        .brand {
            text-align: center;

            margin-bottom: 24px;
        }

        .brand-logo {
            display: inline-flex;
            align-items: center;
            gap: 10px;

            font-family: "Sora", sans-serif;
            font-size: 1.2rem;
            font-weight: 700;

            color: #cbd5e1;
        }

        .brand-dot {
            width: 10px;
            height: 10px;

            border-radius: 3px;

            background: var(--red);

            box-shadow:
                0 0 15px rgba(239,68,68,0.6);
        }

        /* =========================
           LOGIN BOX
        ========================= */

        .login-box {

            position: relative;

            padding: 42px;

            border-radius: 24px;

            background: var(--panel);

            border: 1px solid var(--panel-border);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            box-shadow:
                0 30px 80px rgba(0,0,0,0.55),
                inset 0 1px 0 rgba(255,255,255,0.05);

            overflow: hidden;
        }

        .login-box::before {

            content: "";

            position: absolute;

            top: 0;
            left: 10%;
            right: 10%;

            height: 1px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(96,165,250,0.8),
                    transparent
                );
        }

        /* =========================
           TITULO
        ========================= */

        .logo {

            text-align: center;

            font-family: "Sora", sans-serif;

            font-size: 2.2rem;
            font-weight: 800;

            letter-spacing: -0.05em;

            margin-bottom: 8px;
        }

        .logo .easy {
            color: #f8fafc;
        }

        .logo .rubik {
            color: var(--blue);

            text-shadow:
                0 0 25px rgba(96,165,250,0.25);
        }

        .subtitle {

            text-align: center;

            color: var(--muted);

            font-size: 0.92rem;

            margin-bottom: 32px;
        }

        /* =========================
           ERROR
        ========================= */

        .error {

            display: flex;
            align-items: center;
            gap: 10px;

            padding: 13px 14px;

            margin-bottom: 20px;

            border-radius: 12px;

            background: rgba(239,68,68,0.10);

            border: 1px solid rgba(239,68,68,0.28);

            color: #fca5a5;

            font-size: 0.86rem;

            line-height: 1.4;
        }

        .error::before {
            content: "!";
            
            display: flex;
            align-items: center;
            justify-content: center;

            min-width: 22px;
            height: 22px;

            border-radius: 50%;

            background: rgba(239,68,68,0.2);

            color: #f87171;

            font-weight: 800;
        }

        /* =========================
           FORMULARIO
        ========================= */

        .form-group {
            margin-bottom: 20px;
        }

        label {

            display: block;

            margin-bottom: 8px;

            color: #cbd5e1;

            font-size: 0.85rem;
            font-weight: 600;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {

            position: absolute;

            left: 15px;
            top: 50%;

            transform: translateY(-50%);

            color: #64748b;

            font-size: 17px;

            pointer-events: none;
        }

        input {

            width: 100%;

            height: 52px;

            padding: 0 16px 0 45px;

            border-radius: 12px;

            border: 1px solid #2b3140;

            outline: none;

            background: rgba(30,35,48,0.9);

            color: #f8fafc;

            font-family: "Inter", sans-serif;

            font-size: 0.92rem;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease,
                transform 0.2s ease;
        }

        input::placeholder {
            color: #64748b;
        }

        input:hover {
            border-color: #3b4355;
        }

        input:focus {

            border-color: var(--blue);

            background: rgba(32,38,53,1);

            box-shadow:
                0 0 0 4px rgba(96,165,250,0.10),
                0 8px 25px rgba(0,0,0,0.12);
        }

        /* =========================
           BOTON
        ========================= */

        .login-button {

            position: relative;

            width: 100%;

            height: 52px;

            margin-top: 5px;

            border: none;

            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    #60a5fa,
                    #3b82f6
                );

            color: #07111f;

            font-family: "Sora", sans-serif;

            font-size: 0.92rem;
            font-weight: 700;

            cursor: pointer;

            overflow: hidden;

            box-shadow:
                0 10px 25px rgba(59,130,246,0.22);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                filter 0.2s ease;
        }

        .login-button::before {

            content: "";

            position: absolute;

            top: 0;
            left: -100%;

            width: 60%;
            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,0.35),
                    transparent
                );

            transform: skewX(-20deg);

            transition: left 0.5s ease;
        }

        .login-button:hover {

            transform: translateY(-2px);

            filter: brightness(1.08);

            box-shadow:
                0 15px 35px rgba(59,130,246,0.3);
        }

        .login-button:hover::before {
            left: 130%;
        }

        .login-button:active {
            transform: translateY(0);
        }

        /* =========================
           DIVISOR
        ========================= */

        .divider {

            display: flex;
            align-items: center;

            gap: 12px;

            margin: 26px 0 20px;

            color: #475569;

            font-size: 0.72rem;
        }

        .divider::before,
        .divider::after {

            content: "";

            flex: 1;

            height: 1px;

            background: #252b38;
        }

        /* =========================
           VOLVER
        ========================= */

        .back {

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 7px;

            color: #94a3b8;

            text-decoration: none;

            font-size: 0.84rem;

            transition:
                color 0.2s ease,
                transform 0.2s ease;
        }

        .back:hover {

            color: white;

            transform: translateX(-3px);
        }

        /* =========================
           REGISTRO
        ========================= */

        .register {

            text-align: center;

            margin-top: 20px;

            color: #64748b;

            font-size: 0.84rem;
        }

        .register a {

            color: var(--blue);

            font-weight: 600;

            text-decoration: none;

            margin-left: 4px;

            transition: color 0.2s ease;
        }

        .register a:hover {
            color: #93c5fd;
            text-decoration: underline;
        }

        /* =========================
           PIE
        ========================= */

        .footer {

            text-align: center;

            margin-top: 22px;

            color: #475569;

            font-size: 0.72rem;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 600px) {

            body {
                padding: 18px;
            }

            .login-box {
                padding: 32px 24px;
                border-radius: 20px;
            }

            .logo {
                font-size: 2rem;
            }

            .mini-cube {
                display: none;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

    </style>
</head>

<body>

    <!-- =========================
         FONDO
    ========================== -->

    <div class="background">

        <div class="orb one"></div>
        <div class="orb two"></div>
        <div class="orb three"></div>

        <!-- Cubo decorativo 1 -->

        <div class="mini-cube cube-one">

            <span style="background:#ffffff;"></span>
            <span style="background:#ef4444;"></span>
            <span style="background:#22c55e;"></span>

            <span style="background:#facc15;"></span>
            <span style="background:#3b82f6;"></span>
            <span style="background:#ffffff;"></span>

            <span style="background:#f97316;"></span>
            <span style="background:#22c55e;"></span>
            <span style="background:#ef4444;"></span>

        </div>


        <!-- Cubo decorativo 2 -->

        <div class="mini-cube cube-two">

            <span style="background:#3b82f6;"></span>
            <span style="background:#ffffff;"></span>
            <span style="background:#ef4444;"></span>

            <span style="background:#22c55e;"></span>
            <span style="background:#facc15;"></span>
            <span style="background:#3b82f6;"></span>

            <span style="background:#f97316;"></span>
            <span style="background:#ffffff;"></span>
            <span style="background:#22c55e;"></span>

        </div>

    </div>


    <!-- =========================
         LOGIN
    ========================== -->

    <div class="login-container">

        <div class="brand">

            <div class="brand-logo">

                <span class="brand-dot"></span>

                easyRubik

            </div>

        </div>


        <div class="login-box">

            <div class="logo">

                <span class="easy">easy</span><span class="rubik">Rubik</span>

            </div>

            <div class="subtitle">
                ¡Qué bueno verte de nuevo! 👋
            </div>


            {% if error %}

                <div class="error">
                    {{ error }}
                </div>

            {% endif %}


            <form method="POST">

                {% csrf_token %}


                <!-- USUARIO -->

                <div class="form-group">

                    <label for="username">
                        Usuario
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">
                            
                        </span>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Ingresa tu usuario"
                            autocomplete="username"
                            required
                        >

                    </div>

                </div>


                <!-- CONTRASEÑA -->

                <div class="form-group">

                    <label for="password">
                        Contraseña
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">
                            
                        </span>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Ingresa tu contraseña"
                            autocomplete="current-password"
                            required
                        >

                    </div>

                </div>


                <!-- BOTÓN -->

                <button
                    type="submit"
                    class="login-button"
                >
                    Iniciar sesión →
                </button>

            </form>


            <div class="divider">
                o
            </div>


            <a
                href="{% url 'home' %}"
                class="back"
            >
                ← Volver al inicio
            </a>

        </div>


        <!-- REGISTRO -->

        <div class="register">

            ¿No tienes una cuenta?

            <a href="{% url 'registro' %}">
                Crear cuenta
            </a>

        </div>


        <div class="footer">
            easyRubik · Aprende jugando 🧩
        </div>

    </div>

</body>
</html>
