<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>easyRubik - Iniciar sesión</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #0f1117;
            color: #f8fafc;
            font-family: Arial, sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-box {
            background: #181b24;
            border: 1px solid #2b303d;
            border-radius: 20px;
            padding: 40px;

            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        .logo {
            text-align: center;
            margin-bottom: 10px;
            font-size: 32px;
            font-weight: bold;
        }

        .logo span {
            color: #60a5fa;
        }

        .subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 35px;
            font-size: 15px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #cbd5e1;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 14px 16px;

            background: #20242f;
            border: 1px solid #2b303d;
            border-radius: 10px;

            color: white;
            font-size: 15px;

            outline: none;
            transition: 0.2s;
        }

        input:focus {
            border-color: #60a5fa;
            box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.12);
        }

        .login-button {
            width: 100%;
            padding: 14px;

            border: none;
            border-radius: 10px;

            background: #60a5fa;
            color: #0f1117;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
            transition: 0.2s;
        }

        .login-button:hover {
            transform: translateY(-2px);
            background: #93c5fd;
        }

        .error {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;

            padding: 12px;
            border-radius: 10px;

            margin-bottom: 20px;
            text-align: center;
            font-size: 14px;
        }

        .back {
            display: block;
            text-align: center;

            margin-top: 25px;

            color: #94a3b8;
            text-decoration: none;

            font-size: 14px;
        }

        .back:hover {
            color: white;
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="login-box">

        <div class="logo">
            easy<span>Rubik</span>
        </div>

        <div class="subtitle">
            Inicia sesión para continuar
        </div>

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">
                <label for="username">Usuario</label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Ingresa tu usuario"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Ingresa tu contraseña"
                    required
                >
            </div>

            <button type="submit" class="login-button">
                Iniciar sesión
            </button>

        </form>

        <a href="{% url 'home' %}" class="back">
            ← Volver al inicio
        </a>

    </div>
    <div class="register">
    ¿No tienes una cuenta?
    <a href="{% url 'registro' %}">Crear cuenta</a>
</div>
</div>

</body>
</html>
