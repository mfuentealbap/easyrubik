<script>
    const cube = document.getElementById("cube");

    let rotationX = -25;
    let rotationY = -35;

    let dragging = false;
    let lastX = 0;
    let lastY = 0;

    cube.addEventListener("mousedown", (event) => {
        dragging = true;
        lastX = event.clientX;
        lastY = event.clientY;
    });

    document.addEventListener("mouseup", () => {
        dragging = false;
    });

    document.addEventListener("mousemove", (event) => {
        if (!dragging) return;

        const deltaX = event.clientX - lastX;
        const deltaY = event.clientY - lastY;

        rotationY += deltaX * 0.5;
        rotationX -= deltaY * 0.5;

        cube.style.transform =
            `rotateX(${rotationX}deg) rotateY(${rotationY}deg)`;

        lastX = event.clientX;
        lastY = event.clientY;
    });

   function move(letter) {
    if (letter === "R") {
        rotationY += 90;

        cube.style.transform =
            `rotateX(${rotationX}deg) rotateY(${rotationY}deg)`;
    }
}

    function scramble() {
        alert("Aquí posteriormente generaremos una mezcla real del cubo.");
    }

    function resetCube() {
        rotationX = -25;
        rotationY = -35;

        cube.style.transform =
            `rotateX(${rotationX}deg) rotateY(${rotationY}deg)`;
    }
</script>
